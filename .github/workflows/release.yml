name: Release to Production
concurrency: release-to-prod-pipeline
on:
  push:
    branches:
      - main
      - 'hotfix/*'
jobs:
  create-release:
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    runs-on: ubuntu-24.04
    name: Create Release
    outputs:
      released: ${{ env.RELEASED }}
      newVersion: ${{ env.NEW_VERSION }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
        id: checkout
        with:
          # This is needed for semantic-release to work
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10

      - uses: actions/setup-node@v4
        name: Setup Node.js
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Package Dependencies
        # needed for both commitlint and semantic-release to work
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: pnpm run validate

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: pnpm audit signature -P

      - name: Create GitHub release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic-release
        with:
          branches: |
            [
              'main',
              '+([0-9])?(.{+([0-9]),x}).x',
              {name: 'hotfix/*', prerelease: 'hotfix', channel: 'hotfix'}
            ]
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/github@11
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
